<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Sphere</title>
    <!-- Prevent 404 favicon requests -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Top Offline Banner -->
    <div id="status-banner" style="display: none;">SYSTEM IS OFFLINE</div>
    <!-- Thinking Banner -->
    <div id="thinking-banner" style="display: none;">Thinking...</div>
    
    <div id="app"></div>
    
    <!-- Audio Visualizer -->
    <div id="visualizer-container">
      <canvas id="audio-visualizer"></canvas>
    </div>
    
    <!-- Chat Window overlay -->
    <div id="chat-container">
      <div id="chat-visualizer-container">
        <canvas id="chat-audio-visualizer"></canvas>
      </div>
      <div id="chat-messages">
      </div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type a message..." />
        <button id="chat-send">SEND</button>
        <button id="chat-stop" style="display: none;" class="stop-btn">STOP</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
